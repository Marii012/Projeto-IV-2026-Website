{% load static %}

<!doctype html>
<html lang="pt">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>
        {% block title %}Laboratório Catarina Domingos{% endblock %}
    </title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap"
        rel="stylesheet"
    >

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- CSS principal -->
    <link
        href="{% static 'laboratorio/css/style.css' %}"
        rel="stylesheet"
    >

    <!-- CSS navbar -->
    <link rel="stylesheet" href="{% static 'laboratorio/css/navbar.css' %}">
    <!-- CSS footer -->
    <link rel="stylesheet" href="{% static 'laboratorio/css/footer.css' %}">

    <!-- Animate On Scroll -->
    <link
        href="https://unpkg.com/aos@2.3.1/dist/aos.css"
        rel="stylesheet"
    >

    {% block extra_css %}{% endblock %}

</head>

<body>

    <!-- Mensagens Django -->
    {% if messages %}

        <div class="message-stack container">

            {% for message in messages %}

                <div
                    class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show"
                    role="alert"
                >
                    {{ message }}

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="alert"
                        aria-label="Fechar"
                    ></button>

                </div>

            {% endfor %}

        </div>

    {% endif %}

    <!-- Conteúdo das páginas -->
    {% block content %}{% endblock %}

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    {% block extra_js %}{% endblock %}

    <!-- Animate On Scroll -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

    <script>
        AOS.init({
            duration: 1300,
            once: true,
            offset: 100
        });
    </script>

    <!-- Ficheiros JavaScript -->
    <script src="{% static 'laboratorio/js/navbar.js' %}"></script>
    <script src="{% static 'laboratorio/js/scroll.js' %}"></script>

</body>

</html>
