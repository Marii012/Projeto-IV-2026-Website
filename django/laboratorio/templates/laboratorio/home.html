<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>ProjetoIV - Clínica</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f1f5f9;
            margin: 0;
        }

        header {
            background-color: #2563eb;
            color: white;
            padding: 25px;
            text-align: center;
        }

        main {
            padding: 30px;
            text-align: center;
        }

        .menu {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 40px;
        }

        .card {
            background: white;
            padding: 30px;
            width: 180px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
        }
    </style>
</head>

<body>

<header>
    <h1>ProjetoIV</h1>
    <p>Sistema de Gestão de Clínica Médica</p>
</header>

<main>
    <h2>Bem-vindo ao sistema</h2>
    <p>Gestão de informação do consultório médico.</p>

    <div class="menu">

        <div class="card">
            <h3>Doentes</h3>
            <p>Gestão de doentes</p>
        </div>

        <div class="card">
            <h3>Consultas</h3>
            <p>Gestão de consultas</p>
        </div>

        <div class="card">
            <h3>Prescrições</h3>
            <p>Gestão de medicamentos</p>
        </div>

        <div class="card">
            <h3>Exames</h3>
            <p>Pedidos de exames</p>
        </div>

        <div class="card">
            <h3>Pagamentos</h3>
            <p>Gestão de pagamentos</p>
        </div>

    </div>
</main>

</body>
</html>
